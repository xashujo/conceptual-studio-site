faqs:
  - question: Do the prices include VAT?
    answer: No. Conceptual Studio isn't VAT registered, so the quote is what you pay.
  - question: How long does a new identity take?
    answer: From 4 weeks for a logo and essentials, 8 for a full identity and 12 with a rollout. Calendar weeks, from our first call to your final files, feedback included.
  - question: Can my team make new material after you hand over?
    answer: Yes. With the guidelines and templates, your team can make new posts, letters and presentations without coming back to me.
  - question: Can you handle the printing?
    answer: Yes. On a rollout I handle print through my partners, so everything arrives finished.
homeLink: Brand identity prices
tiers:
  - name: Campaign look
    onHome: true
    price: £1,250
    time: from 2 weeks
    includes: A key visual, colours and type for one campaign or event, plus templates for its posts and posters.
  - name: Logo and essentials
    onHome: true
    price: From £4,900
    time: from 4 weeks
    includes: A logo, colours and typefaces, a one-page guide to using them, and mockups of the identity in use.
  - name: Full identity
    price: From £8,750
    time: from 8 weeks
    includes: Everything in Logo and essentials, plus brand guidelines and templates for social posts, letterheads and presentations.
  - name: Identity and rollout
    price: From £14,000
    time: from 12 weeks
    includes: A full identity on everything people see, from signage to prospectuses and campaigns, with print through my partners.
    note: Quoted per project.

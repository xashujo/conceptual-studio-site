faqs:
  - question: Do the prices include VAT?
    answer: No. Conceptual Studio isn't VAT registered, so the quote is what you pay.
  - question: What files do I get?
    answer: Charts come as PNG and PDF. A full report comes as print-ready PDFs for coated and uncoated paper, an accessible PDF and PNGs of every chart.
  - question: Can the charts match our brand?
    answer: Yes. They're drawn in your colours and typefaces, as if your own team made them.
  - question: How long does a report take?
    answer: Charts from 1 week, a report of around 16 pages from 2 weeks, from our first call to your final files. Longer reports are quoted.
  - question: Can you design a report we reuse every year?
    answer: "Yes. That's the top rung: the report is built as a template, so next year starts from your new figures."
homeLink: Data visualisation prices
tiers:
  - name: Charts and infographics
    onHome: true
    price: From £700
    time: from 1 week
    includes: The charts your document needs, from your own figures, as PNG and PDF ready for your layout.
  - name: Charts and full report
    price: From £1,400
    time: from 2 weeks
    includes: The charts and the whole report around them, such as an annual, strategy or sustainability report. Print-ready PDFs for coated and uncoated paper, an accessible PDF and PNGs.
    note: Priced for a report of around 16 pages; longer reports are quoted.
  - name: Maps and recurring reports
    price: From £2,800
    time: from 4 weeks
    includes: Custom data maps, like the London borough heat maps, or a report designed as a template you can reuse each year.
    note: Quoted per project.

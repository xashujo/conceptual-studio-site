name: Data visualisation and reports
order: 1
lane: Data
page: /services/data-visualisation/
summary: Charts, maps & reports, made from your own figures.
kinds: That can be a set of charts for a document you're laying out yourself, a whole annual, strategy or sustainability report, or custom maps, like heat maps of London boroughs.
demoHeading: A Table Becomes a Chart
demoText: These are real figures from the Department for Education, shown as the table you'd get in a spreadsheet. Press the button to see what I do with them.
examples:
  - src: '@assets/work/usp-freeport-skills/thumb.webp'
    alt: The Skills Heat Map for the Freeport Skills Partnership, printed and lit on a dark surface
    title: Freeport Skills Partnership, USP College, 2026
    caption: Visuals for a workforce skills analysis
  - src: '@assets/work/ncc-sustainability-report/thumb.webp'
    alt: The cover of New City College's Environmental Sustainability report, printed and lit on a dark surface
    title: Sustainability Report, New City College London, 2026
    caption: Charts and layout for the 2025-26 report
faqs:
  - question: Do the prices include VAT?
    answer: No VAT is added. Conceptual Studio isn't VAT registered, so the price you're quoted is the price you pay.
  - question: What files do I get?
    answer: Charts come as PNG and PDF, ready for your own layout. A full report comes as print-ready PDFs for coated and uncoated paper, an accessible PDF and PNGs of every chart.
  - question: Can the charts match our brand?
    answer: Yes. They are drawn in your colours and typefaces, so they sit in your documents as if your own team had made them.
  - question: How long does a report take?
    answer: Charts take from 1 week and a report of around 16 pages from 2 weeks, counted in calendar time from our first call to your final files. Longer reports are quoted.
  - question: Can you design a report we reuse every year?
    answer: "Yes. That is the top rung: the report is built as a template, so next year's edition starts from your new figures, not a blank page."
homeLink: Data visualisation prices
tiers:
  - name: Charts and infographics
    onHome: true
    price: From £700
    time: from 1 week
    includes: The charts your document needs, built from your own figures and supplied as PNG and PDF, ready to drop into your own layout.
  - name: Charts and full report
    price: From £1,400
    time: from 2 weeks
    includes: The charts plus the whole report designed around them, such as an annual, strategy or sustainability report. Supplied as print-ready PDFs for coated and uncoated paper, an accessible PDF and PNGs.
    note: Priced for a report of around 16 pages; longer reports are quoted.
  - name: Maps and recurring reports
    price: From £2,800
    time: from 4 weeks
    includes: Custom data maps, like the London borough heat maps, or a report designed as a template you can reuse each year.
    note: "Quoted per project. [TBC: how long the heat maps took]"

aboutLead: I set up Conceptual Studio in London in 2024. I turn reports, plans and spreadsheets into charts, maps and identities that make sense on first read.
steps:
  - title: Discovery
    text: Send a short note and you'll get a reply {reply time}. On a free 20-minute
      call we agree audience, formats and budget. A fixed quote follows, before any
      work begins.
  - title: Direction
    text: Early ideas, before anything is polished. You pick one, and it sets the
      course.
  - title: Development
    text: I build the full set and share it as it takes shape, with the feedback rounds
      set out in your quote.
  - title: Delivery
    text: I check every detail. Once you sign off, you get the files in the formats
      your team needs.
closeText: Tell me what you're working on, and I'll be in touch.

howHeading: How It Works
howIntro: Four stages, each ending in a clear decision, so you always know where your project stands.
aboutLead: Conceptual Studio was founded in London in 2024 to make complex ideas clear. Strategies, mergers and annual figures become identities, charts and pages that people take in at a glance and remember.
aboutText: I'm Joshua. You'll work with me directly, from brief to final files. I enjoy the problems that look dry on paper, like a merger to explain, a year of figures to present or an identity that has to hold together across a whole college. I start every project from one idea and judge it by whether people understand it. There are no hand-offs, so your project gets my full attention.
steps:
  - title: Discovery
    text: Book a free 20-minute call or send me a short note. I reply {reply time}.
      On the call we agree the audience, formats and budget, then I
      send a fixed quote, so the cost is settled before any work begins.
  - title: Direction
    text: I show you early ideas before anything is polished. You choose the one to
      take forward, and that decision sets the course for everything after it.
  - title: Development
    text: I build out the full set of pages, charts or assets and share work in
      progress as it takes shape. Your feedback comes in the rounds set out in your
      quote, so you always know what is changing and what comes next.
  - title: Delivery
    text: Nothing is final until you sign it off. I check every detail, then hand
      over the files in the formats your team needs.
values:
  - title: Clarity First
    text: If a chart or a page needs explaining, it isn't finished yet.
  - title: Made to Be Used
    text: Files and guidelines your own team can work from, without coming back to
      me every time.
  - title: Small and Focused
    text: You talk to the person doing the work, from the first call to the final
      files.
closeText: Book a free 20-minute call, or tell me a little about what you're working on and I'll be in touch about next steps.

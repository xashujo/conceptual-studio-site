approach:
  - title: Clear Charts from Messy Data
    text: I turn big spreadsheets & long reports into charts people can follow.
  - title: Brand & Data Together
    text: I do both, so your reports and charts look like the rest of your brand.
  - title: One Designer, Brief to Files
    text: You deal with me from the first call to the final files.
  - title: Works With Your Team
    text: Your team knows its systems. I add the design and the wording at a fixed
      price, so your team keeps its time for the core work.

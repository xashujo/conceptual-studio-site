howHeading: How We Work
howIntro: Four stages, each ending in a clear decision, so you always know where your project stands.
aboutMe: I'm Josh, the designer behind Conceptual Studio. When you work with the studio, you work with me.
aboutLead: Conceptual Studio was founded in London in 2024 to make complex ideas clear. Strategies, mergers and annual figures become identities, charts and pages that people take in at a glance and remember.
aboutText: We enjoy the problems that look dry on paper, like a merger to explain, a year of figures to present or an identity that has to hold together across a whole college. We start every project from one idea and judge it by whether people understand it.
servicesImage: "@assets/art/engraved/apotheosis-services.jpg"
howImage: "@assets/art/engraved/apotheosis-how.jpg"
aboutImage: "@assets/art/engraved/apotheosis-about.jpg"
steps:
  - title: Discovery
    text: Send us a short note and you'll get a reply {reply time}. On a free 20-minute
      call we agree the audience, formats and budget, then send a fixed quote, so
      the cost is settled before any work begins.
  - title: Direction
    text: We show you early ideas before anything is polished. You choose the one to
      take forward, and that decision sets the course for everything after it.
  - title: Development
    text: We build out the full set of pages, charts or assets and share work in
      progress. Your feedback comes in the rounds set out in your quote.
  - title: Delivery
    text: Nothing is final until you sign it off. We check every detail, then hand
      over the files in the formats your team needs.
values:
  - title: Clarity First
    text: If a chart or a page needs explaining, it isn't finished yet.
  - title: Made to Be Used
    text: Files and guidelines your own team can work from, without coming back to
      us every time.
  - title: Small and Focused
    text: You talk to the person doing the work, from the first call to the final
      files.
closeText: Tell us what you're working on and we'll be in touch about next steps.

outcome: Eight maps & charts for the merger consultation, March 2024.
problem: |
  In 2024 New City College and Brooke House Sixth Form College (BSix) proposed merging, and put out a public consultation document: A strong and secure future for post-16 education in Hackney.

  The case for the merger rested on where Hackney's 16 to 18 year olds come from and which campuses they choose. That lived in spreadsheets of postcodes and student numbers, and parents, staff and the local community needed to see it at a glance.
whatIDid: |
  I worked through the 2022/23 student data for both colleges and made eight maps & charts. Heat maps show which postcodes each college draws from, pie charts break that down by borough, and a map follows Hackney's students out to the other NCC campuses.

  I kept the colour coding the same across every chart and matched it to NCC's brand, so the set reads as one piece. The set went through a round of edits before the document went out.

  Figures in these images are blurred for GDPR reasons.

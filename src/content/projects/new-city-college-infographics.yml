summary: Infographics for the merger of BSix Sixth Form College into New City College.
listText: "New City College & BSix put out a consultation on merging, and the case rested on where Hackney's students travel from. I made eight maps & charts from the colleges' 2022/23 student data, from heat maps by postcode to the distance between the two sites. They went into the consultation document in March 2024."

outcome: Maps and charts for the BSix merger consultation.
problem: |
  BSix Sixth Form College was consulting on a merger with New City College London. The consultation document had to give students, parents, staff and other stakeholders the essential facts quickly: where the campuses are, how people travel between them, and how many students each serves. It also had to look like New City College.
whatIDid: |
  Working closely with the college, I designed a set of infographics for the consultation document: detailed maps of the campuses and travel routes, and charts of student numbers.

  Clean layouts, simple icons and accessible colour coding kept the data legible without crowding the text, and every piece follows New City College's brand.

whatHappened: |
  The visuals went into the partnership's report and slides in April 2026. The report ends on three next steps for the partnership: a hub-and-spoke model, a shared digital library and a national skills manifesto.

  Some of the graphics will be on screen at the partnership's Parliamentary launch in December 2026.

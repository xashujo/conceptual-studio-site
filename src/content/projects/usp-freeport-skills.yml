outcome: Six visuals for the partnership's 2026 State of the Nations report.
problem: |
  USP College leads a partnership of further education colleges across the UK's Freeports. It spoke to every partner college about the skills each Freeport needs, and wanted the findings in a report: The UK Freeport Skills Landscape, State of the Nations 2026.

  The readers were busy college and Freeport leaders, who needed to see at a glance where each Freeport stands, where the skills gaps are and which colleges to learn from.
whatIDid: |
  I turned the findings of a workforce analysis into a set of visuals: a map of the partner colleges, a maturity spectrum, a skills heat map and a roadmap, plus slides.

  One figure in these images is blurred for GDPR reasons.

problem: |
  New City College's 2025-26 environmental sustainability report had to look professional, follow the college's brand and make its figures easy to follow.

  It's the college's yearly public update on carbon emissions: Scope 1, 2 and 3, energy use on each campus, the year's other sustainability work and next year's priorities.
whatIDid: |
  I redrew the charts in Illustrator and laid out the 16-page A4 report in InDesign, in the college's brand and its Euclid Circular typeface.

  No formats were specified, so I made print files (coated & uncoated), a digital PDF, an interactive PDF and, on my own initiative, an accessible PDF.

  The numbers in the images on this page are blurred to protect the college's figures.

problem: |
  New City College's annual report on environmental sustainability for 2025-26 had to look professional, meet the college's brand rules and make its figures easy to follow.

  The report is the college's yearly public update on its carbon emissions. It covers Scope 1, 2 and 3 emissions, energy use on each campus, the rest of its sustainability work that year and its priorities for the next.
whatIDid: |
  I redrew the charts in Illustrator and laid out the 16-page A4 report in InDesign, in the college's brand and its Euclid Circular typeface. It was scoped at about two days and stretched to three.

  No file formats were specified, so I made the print files (coated & uncoated), a digital PDF, an accessible PDF and an interactive PDF myself. The accessible version was my own addition.

  The numbers in the images on this page are blurred to protect the college's figures.

problem: |
  ACL Essex runs adult learning from centres across the county. For its strategic intent document it needed to show who its learners were in 2024 and where they came from: their employment status, whether they were on Universal Credit, their ethnicity and the local authority they live in.

  All of it sat in internal spreadsheets, one row per learner, and it had to make sense to council readers who would never open them.
whatIDid: |
  I sorted the year's learner records by centre and by local authority first. Then I turned them into infographics and regional maps: a heat map of Essex shaded by enrolments, and a stacked bar chart that shows which centre each local authority's learners go to.

  Figures in these images are blurred for GDPR reasons.

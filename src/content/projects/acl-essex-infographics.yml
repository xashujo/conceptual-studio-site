summary: Infographics and regional maps of learner data across ACL's delivery centres in Essex.
listText: "ACL Essex had a year of learner data spread across its centres and wanted it in its strategy document. I sorted it by centre & local authority and turned it into a heat map of Essex and a set of charts. Essex County Council were really pleased with them and used them in their strategy papers."

outcome: Learner data from seven delivery centres, compared at a glance.
problem: |
  ACL Essex runs adult learning across seven delivery centres. It needed its 2024 learner data presented clearly: who its learners are, where they live, and whether they are in work or claiming Universal Credit. The figures sat in complex internal data sets, and they had to be compared centre by centre by a wide audience.
whatIDid: |
  I sorted the data first, then designed a series of infographics and regional maps covering employment status, Universal Credit enrolment, ethnicity and where learners live.

  Each piece follows the same structure, so any centre can be set beside another. Pie charts carry the splits, heat maps show the geographic spread by local authority, and the type is set for accessibility. Everything sits within ACL's own visual identity.

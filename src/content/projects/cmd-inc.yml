problem: |
  CMD Inc. is a music company working across film, games, healthcare & music therapy. It was planning a website built around its soundscapes, and needed an identity that looked like its sound, plus 3D & motion pieces for the site.

  The brief: a look that moves like spatial audio, with a sci-fi feel and an interface that's easy on the eye.
whatIDid: |
  I started with the wordmark. The client's first font was pixelated, so my early versions made the type look like stardust moving with the sound. The final wordmark is set in SF Pro Semibold, inside a rounded outline.

  Then came the icon, the Star Note, and every 3D, motion & web file the developer needed. It all went into a visual identity guide and one shared folder.

problem: |
  CMD Inc. makes sound for film & games, and was planning a website built around its soundscapes. It needed an identity that looked like its sound, plus 3D and motion pieces for the site.

  The brief: a look that moves like spatial audio, with a sci-fi feel and an interface that's easy on the eye.
whatIDid: |
  I started with the wordmark. The client's first font was pixelated, so my first version made the type look like stardust moving with the sound. The final identity is set in SF Pro Semibold.

  The icon, the Star Note, followed: six ovals around a bright centre, drawn from the shape of a musical note. Radial halftone lines on the marks echo movement in sound. The colours are black & white, kept close to the client's reference site.

  Then I built what the website needed: a logo reveal, 3D social icons, mockups, a favicon, app icon styles and web-ready video for each browser. It all went into a visual identity guide and a shared folder for the developer.

problem: |
  CMD Inc. makes sound for film & games, and was planning a website built around its own soundscapes. It needed an identity that looked like the sound it makes, plus the 3D and motion pieces the site would use.

  The brief was a look that moves like spatial audio, with a sci-fi feel and an interface that is easy on the eye.
whatIDid: |
  I started with the wordmark. The client's first font was pixelated, so my first version made the type look like stardust that could move with the sound. The final identity is set in SF Pro Semibold.

  The icon, the Star Note, followed: six ovals around a bright centre, drawn from the shape of a musical note. Radial halftone lines on the marks echo movement in sound. The colours are black & white, kept close to the client's reference site.

  I then built what the website needed: a logo reveal animation, 3D models of the social icons, mockups, a favicon, app icon styles and web-ready video files for each browser. Everything went into a visual identity guide and a shared folder for the web developer.

whatIDid: |
  I built the identity around one mark, the Star Note: six ovals around a bright centre, drawn from the shape of a musical note.

  It comes with a wordmark in a pill shape, set in SF Pro, and works in black on white or white on black. I also made a favicon, app icon styles and an animated reveal for the website.

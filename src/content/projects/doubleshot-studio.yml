whatIDid: |
  I designed the whole identity: wordmark, colours, type and the two star characters that sit beside it.

  The palette is three colours used in set amounts: DoubleShot Linen as the main colour, Terracotta as the second and Soot as the accent.

  I then showed it on real things, such as business cards, a tote bag, matches, a box sticker and a street banner, so the studio could see it working before it was printed.

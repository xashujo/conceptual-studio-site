outcome: A full identity in about a week, from logo to 3D characters.
problem: |
  DoubleShot is a small creative studio run by two designers. They wanted an identity that was warm and bold, with a sense of humour, but still serious about the work.

  The brief: two creative points of view, one clear voice.
whatIDid: |
  I designed the whole identity: wordmark, colours, type and two star characters, The Duo, one for each point of view. Each has its own personality, and they're stronger side by side.

  Three colours in set amounts: DoubleShot Linen as the main, Terracotta second and Soot as the accent.

  Then I put it on real things so the studio could see it working before print: business cards, a tote bag, matches, a box sticker and a street banner.

problem: |
  DoubleShot is a small London creative studio started by friends, built on the idea that two points of view make one stronger voice. They needed an identity that showed that: warm and bold, with a sense of humour, but still serious about the work.

  The brief was simple. Two creative points of view, one clear voice.
whatIDid: |
  I designed the whole identity: wordmark, colours, type and the two star characters that sit beside it. The characters, The Duo, stand for those two points of view. Each has its own personality, and they're always stronger side by side.

  The palette is three colours used in set amounts: DoubleShot Linen as the main colour, Terracotta as the second and Soot as the accent.

  I then showed it on real things, such as business cards, a tote bag, matches, a box sticker and a street banner, so the studio could see it working before it was printed.

whatHappened: |
  Everything went into a brand guidelines deck: the wordmark in full and short form, the colour pairings, the type, app icons, a favicon, social profile pictures and 3D renders of The Duo.

  The characters were built to travel. They take on themed accessories and settings, so the studio can use them in campaigns and social posts without the identity losing its shape.

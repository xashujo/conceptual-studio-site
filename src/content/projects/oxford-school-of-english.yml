problem: |
  The Oxford School of English had just been bought by New City College. It teaches English to students from abroad, 120 of them from 29 countries when I started, and wanted more. Its old logo was dated, looked too much like the Oxford reference books and used Oxford Blue, a colour registered to Oxford University, so it couldn't be trademarked.

  The school wanted to look modern and prestigious without losing its historic roots.
whatIDid: |
  This was a solo project: logo, type and colour.

  I put an English lion inside a shield, after the traditional English crest. It nods to the England football crest and the Harry Potter house crests, both familiar to students from abroad.

  The two colours, Oxford Gold and Oxford White, come from the stone of the city's buildings. The type pairs a classic serif with a modern sans to keep the prestige without looking dated.

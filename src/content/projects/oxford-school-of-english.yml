summary: A new identity for a private English school in Oxford, now a UK-registered trademark.
listText: "The Oxford School of English wanted more students from abroad, but its old logo looked too much like the Oxford reference books and said little to them. I redesigned the logo, type & colour on my own, with an English lion inside a shield."

problem: |-
  A London college group wanted a better way for people to find courses online, and later narrowed the focus to construction courses at colleges and training providers across London.

  It needed to work for 16 to 18-year-olds, adults changing career and learners with additional needs, mostly on phones. Staff with no technical background needed to keep it up to date themselves. The college's first idea was to build it in Power BI.
whatIDid: |-
  We compared Power BI with a custom tool and found that Power BI's public reports don't adapt to phones and don't forgive spelling mistakes. So we designed and built a working prototype: a course finder that sits inside the college's own WordPress site and matches its brand.

  - Search that forgives typos and trade slang: "plumming" finds Plumbing, and "sparky" finds Electrical.
  - An "I am…" choice that shows only the courses meant for each learner, and what each one costs them.
  - Filters for trade, provider, level and when courses run.
  - A London map where each location is placed from its postcode, with circles that grow with matching courses and one-tap directions.
  - An Excel upload that staff use to update courses, with every file checked before it goes live.
  - Designed to the WCAG 2.2 AA accessibility standard, with a text table alongside the map.
whatHappened: |-
  A fully working prototype, live online with sample providers, plus a proposal covering the build, launch and support. It's ready to adapt for any college or training provider.

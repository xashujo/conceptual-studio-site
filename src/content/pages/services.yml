heading: Services
intro: Data visualisation and brand identity for colleges, public bodies and growing businesses. I turn your figures into charts, maps and reports, and design identities your team can use.
note: Every project is priced on its scope, so the prices here are starting points. You'll get a fixed quote after our first call.
quoteNote: "Fixed quotes, with most projects coming in under £5,000."
retainersHeading: Monthly Plans
retainersNote: Three days a month covers your social templates, monthly report graphics and campaign assets, without hiring. Three-month minimum, then month to month with 30 days' notice.
listHeading: One-Off Projects
listNote: Two kinds of project, each with an easy first step.

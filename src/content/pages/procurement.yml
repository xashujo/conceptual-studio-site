heading: Procurement
intro: What your finance team needs to set me up as a supplier, from company details to how invoices are raised and paid.
orgHeading: Working with Organisations
org:
  - title: A Registered Company
    text: Conceptual Studio Limited, registered in England and Wales, company number 15410582.
  - title: Purchase Orders
    text: I invoice against your purchase order, on Net 30 terms.
  - title: NDAs and Data Agreements
    text: I'm happy to sign your NDA or data-processing agreement before we start.
  - title: Careful with Your Data
    text: Your files and figures are used only for your project, and deleted when you ask.
detailsHeading: Supplier Details
details:
  - label: Company
    value: Conceptual Studio Limited, a London-based SME registered in England and Wales.
  - label: Company number
    value: "15410582"
  - label: Registered office
    value: "63 Heathwood Gardens, London, SE7 8ET"
  - label: VAT
    value: Not VAT registered, so no VAT is added to invoices.
  - label: Payment terms
    value: Net 30. Invoices are due 30 days from the invoice date.
  - label: Purchase orders
    value: I invoice against your purchase order. Send the PO number before work starts and it goes on every invoice.
  - label: How to pay
    value: Bank transfer. The bank details are on every invoice. The site takes no card payments.
  - label: Invoices
    value: Sent by email as a PDF, at the stages set out in your quote.
stepsHeading: How Invoicing Works
steps:
  - title: Quote
    text: A fixed quote for the agreed scope, sent {reply time} of our first call.
  - title: Purchase Order
    text: You raise a purchase order against the quote and send me its number.
  - title: Invoice
    text: I invoice against the PO at the stages agreed in the quote, by email as a PDF.
  - title: Payment
    text: You pay by bank transfer within 30 days of the invoice date.
packButton: Ask for the Supplier Pack
packText: Ask for the supplier pack and I'll send everything your finance team needs to set me up, in one email.
closeText: Need the supplier pack, or a quote to raise a PO against? Email me and I'll reply {reply time}.

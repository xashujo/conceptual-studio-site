heading: About
intro: I'm Joshua. Conceptual Studio is my design practice in London, for brand identity, data visualisation and video. You'll work with me directly, from the first call to the final files.
storyHeading: One Designer, Start to Finish
story: |
  I run Conceptual Studio on my own, so you talk to the person doing the work, not an account manager.

  I trained at Kingston School of Art, where I learned identity systems, layout and how to build a design from one idea. After that I was lead designer at Fou Answer, a tech startup in Tokyo, looking after its product and brand in a small team that moved quickly.

  The studio has been my full-time job since January 2026. Most of what I make is brand identity and data visualisation: logos that end up on buses and station platforms, and reports whose figures have to make sense the first time someone reads them. I also edit short videos for social media.
valuesHeading: How I Work
values:
  - title: One Idea, Made Clear
    text: Every project starts from one idea, and I judge the work by whether people understand it the first time.
  - title: Fixed Quotes
    text: You get a fixed quote for the agreed scope before anything starts, so the price doesn't move.
  - title: Direct Contact
    text: You talk to the person doing the work, from the first call to the final files.
clientsHeading: Who I've Worked With
wantHeading: The Work I Want
want: |
  More of what I already do: colleges and public bodies that need an identity their own team can use, or numbers that have to be understood by governors, staff and the public. Companies with the same problem are just as welcome, from startups to larger organisations, here or abroad.

  I'm a good fit if you want one person to take a project from brief to files, and a less good one if you need a large team on call every day.
closeText: If that sounds like the right fit, tell me about your project and I'll reply {reply time}.

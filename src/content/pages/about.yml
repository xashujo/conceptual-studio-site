heading: About
intro: I'm Joshua, a designer in London. I make charts, reports and brand identities, and you work with me from the first call to the final files.
storyHeading: One Designer, Start to Finish
story: |
  I studied identity, layout and 3D at Kingston School of Art. My BA final project was about mental health, told in 3D.

  Then I spent two years as lead designer at Fou Answer, a tech startup in Tokyo, running its brand and product in a small, fast team.

  Conceptual Studio has been my full-time job since January 2026. Most of the work is data: maps of 7,112 learner records for ACL Essex, skills maps and a white paper for the USP College Freeport partnership, merger maps New City College used in its public consultation, and a sustainability report that passed Acrobat's accessibility check. The rest is identity, like the Oxford School of English crest, now a registered trademark, and the Star Note for CMD Inc.

  Nearly all of it comes through past clients, or the people they send my way.

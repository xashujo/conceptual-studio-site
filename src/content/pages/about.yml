valuesHeading: How I Work
values:
  - title: One Idea, Made Clear
    text: Every project starts from one idea. The test is whether people get it on first read.
    icon: idea
  - title: Fixed Quotes
    text: A fixed quote for the agreed scope, before anything starts. The price doesn't move.
    icon: quote
  - title: Accessible Reports
    text: Tagged PDFs with alt text and a set reading order, the way public bodies have to publish.
    icon: accessible
clientsHeading: Who I've Worked With
wantHeading: The Work I Want
want: |
  More data work: annual and sustainability reports, maps and charts that boards, staff and the public need to grasp quickly. Most of it so far has been for colleges. Councils, charities and companies have the same problem, and I want to work with them too.

  And brand identity, for organisations that want a mark and templates their own team can keep using.

  I'm a good fit if you want one person from brief to files. If you need a large team on call every day, an agency will suit you better.
closeText: Sound right? Tell me about your project and I'll reply {reply time}.

heading: About
intro: I'm Joshua, a designer in London. I make charts, reports and brand identities for colleges, public bodies and growing businesses, and you work with me from the first call to the final files.
storyHeading: One Designer, Start to Finish
story: |
  I studied at Kingston School of Art, where I learned identity, layout and 3D. My final major project for my BA was about mental health, told in 3D.

  Then I spent two years as lead designer at Fou Answer, a tech startup in Tokyo, looking after its brand and product in a small team that moved quickly.

  Conceptual Studio has been my full-time job since January 2026. Most of the work is data now: maps of 7,112 learner records for ACL Essex, skills maps and a white paper for the USP College Freeport partnership, merger maps that New City College used in its public consultation, and a sustainability report that passed Acrobat's accessibility check. The rest is identity, like the Oxford School of English crest, which is now a registered trademark, and the Star Note mark for CMD Inc.

  Nearly all of it comes from people I've worked with before, or people they sent my way.
valuesHeading: How I Work
values:
  - title: One Idea, Made Clear
    text: Every project starts from one idea, and I judge the work by whether people understand it the first time.
  - title: Fixed Quotes
    text: You get a fixed quote for the agreed scope before anything starts, so the price doesn't move.
  - title: Accessible Reports
    text: Reports go out as tagged PDFs, with alt text and a set reading order, because public bodies have to publish them that way.
clientsHeading: Who I've Worked With
wantHeading: The Work I Want
want: |
  More data work: annual and sustainability reports, maps, and charts that boards, staff and the public need to understand quickly. Colleges are where I've done most of it so far. Councils, charities and companies have the same problem, and I'd like to do more of it there too.

  Brand identity is the other half, for organisations that want a mark and a set of templates their own team can keep using.

  I'm a good fit if you want one person to take a project from brief to files. If you need a large team on call every day, an agency will suit you better.
closeText: If that sounds like the right fit, tell me about your project and I'll reply {reply time}.

  - name: settings
    label: Site settings
    type: file
    path: src/content/settings/site.yml
    format: yaml
    fields:
      - { name: availability, label: Taking new projects, type: boolean, description: "Shows or hides the green dot on the home page." }
      - { name: availabilityText, label: Availability text, type: string, required: true }
      - { name: email, label: Email, type: string, required: true }
      - { name: responseTime, label: Reply time, type: string, required: true, description: "Finishes the sentence \"I reply...\", e.g. within three working days" }
      - { name: nextSteps, label: What happens next, type: text, description: "One short line under the enquiry form. {reply time} becomes the Reply time above. Empty hides it." }
      - name: socialLinks
        label: Social links
        type: object
        list: true
        fields:
          - { name: label, label: Name, type: string, required: true }
          - { name: url, label: Link, type: string, required: true }
      - { name: companyName, label: Company name, type: string, required: true }
      - { name: companyNumber, label: Company number, type: string, required: true }
      - { name: registeredOffice, label: Registered office, type: string, required: true, description: "As listed on Companies House. Shown in the footer and on the Privacy page." }
      - { name: footerText, label: Footer line, type: text, required: true, description: "The short line under the logo in the footer." }
      - { name: colophon, label: Colophon, type: text, required: true, description: "The small note in the footer on the type, the art and how the site is built." }
      - name: favicon
        label: Favicon
        type: image
        required: true
        description: "The little icon in the browser tab and on phone home screens. Upload a square-ish PNG or SVG, at least 512px, on a transparent background. Empty edges are trimmed so the mark fills the tab. The site makes every size from it."
        options:
          media: images
      - name: glass
        label: Glass
        type: object
        description: "100 is the glass as it was designed. To go back to the original look, set all five to 100. Lower means less, higher means more (0 to 200). Try values first with the sliders on the /glass/ page, then type them in here."
        fields:
          - name: bend
            label: Bend
            type: number
            default: 100
            description: "How strongly the edges bend what is behind the glass."
            options: { min: 0, max: 200, step: 5 }
          - name: frost
            label: Frost
            type: number
            default: 100
            description: "How much paper colour fills the glass. Lower is clearer."
            options: { min: 0, max: 200, step: 5 }
          - name: blur
            label: Blur
            type: number
            default: 100
            description: "How soft things look through the glass."
            options: { min: 0, max: 200, step: 5 }
          - name: shine
            label: Shine
            type: number
            default: 100
            description: "How bright the light catches on the rim."
            options: { min: 0, max: 200, step: 5 }
          - name: reach
            label: Reach
            type: number
            default: 100
            description: "How far in from the edge the bend travels. Higher drags the bend further into the glass."
            options: { min: 0, max: 200, step: 5 }

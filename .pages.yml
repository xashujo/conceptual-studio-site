      - { name: elsewhereHeading, label: Social links heading, type: string, required: true, description: "The links themselves are in Site settings." }
      - { name: procurementHeading, label: Procurement box heading, type: string, required: true }
      - { name: procurementText, label: Procurement box text, type: text, required: true }
      - { name: procurementButton, label: Procurement button, type: string, required: true }
      - { name: enquiryHeading, label: Start button, type: string, required: true }
      - { name: formHeading, label: Form heading (Contact page), type: string, required: true }
      - { name: enquiryIntro, label: Form intro, type: text, required: true }
      - { name: enquiryAlt, label: Email line under the intro, type: string, description: "{email} becomes the email address. Empty hides it." }
      - { name: callLink, label: Booking link, type: string, description: "The free 20-minute call, e.g. your Google Calendar booking page. Empty hides the button." }
      - { name: callButton, label: Booking button, type: string, required: true }
      - { name: thanksHeading, label: Thank-you heading, type: string, required: true }
      - { name: thanksText, label: Thank-you text, type: text, required: true }
      - { name: closeHeading, label: End of page heading, type: string, required: true, description: "The big heading over the last panel, e.g. Prefer to Talk?" }
      - { name: closeText, label: End of page text, type: text, required: true, description: "The words over the Booking and Copy Email buttons at the end of the page." }


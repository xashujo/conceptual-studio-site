# Pages CMS configuration (https://pagescms.org/docs/configuration/)
# Field names and options mirror src/content.config.ts. If you change one, change the other.

media:
  - name: images
    label: Images
    input: src/assets/uploads
    output: ../../assets/uploads
    extensions: [jpg, jpeg, png, webp, avif]

content:
  # ---------------------------------------------------------------- Projects
  - name: projects
    label: Projects
    type: collection
    path: src/content/projects
    format: yaml-frontmatter
    filename: "{primary}.md"
    view:
      primary: title
      fields: [title, year, client, featured, archive]
      sort: [year, title, order]
      default:
        sort: year
        order: desc
    fields:
      - name: title
        label: Title
        type: string
        required: true
        description: The project name. When you first save, the web address is made from this (e.g. /work/fou-answer/).
      - name: client
        label: Client
        type: string
        required: true
        description: Who the work was for, written how you'd like it shown.
      - name: year
        label: Year
        type: number
        required: true
        description: The year the work was finished, e.g. 2026.
      - name: category
        label: Category
        type: select
        required: true
        description: Groups the project with similar work.
        options:
          values: [brand, data, motion]
      - name: summary
        label: One-line summary
        type: string
        required: true
        description: One line, shown under the project on the homepage.
      - name: featured
        label: Show on homepage
        type: boolean
        default: false
        description: Tick to show this project on the homepage.
      - name: order
        label: Homepage position
        type: number
        default: 99
        description: Lower numbers come first. 1 is the top spot. Leave at 99 if you don't mind where it goes.
      - name: archive
        label: Archive
        type: boolean
        default: false
        description: Tick to move an older project out of the main list and into the archive.
      - name: disciplines
        label: Disciplines
        type: string
        list: true
        required: true
        description: What you did, one per line, e.g. Brand identity, Infographics, Motion.
      - name: context
        label: Context (optional)
        type: text
        description: A short line of background, if the project needs one. Leave empty if not.
      - name: cover
        label: Cover image
        type: image
        required: true
        description: The main image, used on cards and at the top of the project page.
        options:
          media: images
      - name: coverAlt
        label: Cover image description (alt text)
        type: string
        required: true
        description: Describe what the image shows for people using screen readers, e.g. "Prospectus covers in purple and orange on a desk".
      - name: problem
        label: The problem
        type: text
        description: What the client needed and why.
      - name: approach
        label: What I did
        type: text
        description: Your approach and the main decisions.
      - name: outcome
        label: What happened
        type: text
        description: The result. Real numbers or quotes are best.
      - name: testimonial
        label: Testimonial (optional)
        type: reference
        description: Pick a testimonial to show on this project. Add new ones under Testimonials first.
        options:
          collection: testimonials
          search: name, organisation
          value: "{path}"
          label: "{name}, {organisation}"
      - name: link
        label: Link (optional)
        type: object
        description: A link to the live work. Fill in both boxes, or leave both empty.
        fields:
          - name: label
            label: Link text
            type: string
            description: e.g. "See the live report"
          - name: url
            label: Web address
            type: string
            description: The full address, starting https://
      - name: blocks
        label: Gallery
        type: block
        list: true
        blockKey: type
        description: The images, text and numbers further down the project page, in order. Drag to reorder.
        blocks:
          - name: image
            label: Image
            fields:
              - name: size
                label: Size
                type: select
                default: wide
                description: Full is edge to edge, wide is the normal width, narrow is smaller and centred.
                options:
                  values: [full, wide, narrow]
              - name: src
                label: Image
                type: image
                required: true
                options:
                  media: images
              - name: alt
                label: Image description (alt text)
                type: string
                required: true
                description: What the image shows, in a sentence.
              - name: caption
                label: Caption (optional)
                type: string
          - name: pair
            label: Two images side by side
            fields:
              - name: left
                label: Left image
                type: object
                fields:
                  - name: src
                    label: Image
                    type: image
                    required: true
                    options:
                      media: images
                  - name: alt
                    label: Image description (alt text)
                    type: string
                    required: true
                  - name: caption
                    label: Caption (optional)
                    type: string
              - name: right
                label: Right image
                type: object
                fields:
                  - name: src
                    label: Image
                    type: image
                    required: true
                    options:
                      media: images
                  - name: alt
                    label: Image description (alt text)
                    type: string
                    required: true
                  - name: caption
                    label: Caption (optional)
                    type: string
          - name: text
            label: Text
            fields:
              - name: heading
                label: Heading (optional)
                type: string
              - name: body
                label: Text
                type: text
                required: true
          - name: stat
            label: Big number
            fields:
              - name: value
                label: Number
                type: string
                required: true
                description: e.g. "12,000" or "3x"
              - name: label
                label: What it means
                type: string
                required: true
                description: e.g. "students reached in the first term"
          - name: video
            label: Video
            fields:
              - name: mp4
                label: Video file (optional)
                type: string
                description: Path to a video in public/media, e.g. /media/work/fou-answer/reel.mp4. Use this or YouTube, not both.
              - name: youtube
                label: YouTube link (optional)
                type: string
                description: The YouTube address of the video.
              - name: poster
                label: Still image (optional)
                type: image
                description: Shown before the video plays.
                options:
                  media: images
              - name: alt
                label: Video description (optional)
                type: string
                description: A sentence on what the video shows.
              - name: caption
                label: Caption (optional)
                type: string

  # ---------------------------------------------------------------- Services
  - name: services
    label: Services
    type: collection
    path: src/content/services
    format: yaml-frontmatter
    filename: "{primary}.md"
    view:
      primary: title
      fields: [title, order]
      sort: [order, title]
      default:
        sort: order
        order: asc
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: order
        label: Position
        type: number
        default: 1
        description: Lower numbers come first on the Services page.
      - name: short
        label: Short name
        type: string
        required: true
        description: A shorter name for menus and small cards.
      - name: summary
        label: Summary
        type: text
        required: true
        description: A sentence or two at the top of the service page.
      - name: image
        label: Image
        type: image
        required: true
        options:
          media: images
      - name: imageAlt
        label: Image description (alt text)
        type: string
        required: true
      - name: includes
        label: What's included
        type: string
        list: true
        required: true
        description: One item per line.
      - name: kinds
        label: Kinds of work
        type: string
        list: true
        required: true
        description: Examples of this service, one per line, e.g. Prospectus, Annual report.
      - name: tiers
        label: Prices
        type: object
        list: true
        description: Each package and its starting price.
        fields:
          - name: name
            label: Package name
            type: string
            required: true
          - name: price
            label: Starting price (£)
            type: number
            description: Numbers only, no £ sign or commas, e.g. 2400. Leave empty if there's no fixed starting price.
          - name: description
            label: Description
            type: text
            required: true
          - name: includes
            label: What's included
            type: string
            list: true
          - name: timeline
            label: Timeline (optional)
            type: string
            description: e.g. "3 to 4 weeks"
      - name: faqs
        label: Questions and answers
        type: object
        list: true
        fields:
          - name: q
            label: Question
            type: string
            required: true
          - name: a
            label: Answer
            type: text
            required: true
      - name: related
        label: Related services
        type: string
        list: true
        description: File names without .md, one per line. Leave as they are unless you're adding or removing a link.

  # ---------------------------------------------------------------- Testimonials
  - name: testimonials
    label: Testimonials
    type: collection
    path: src/content/testimonials
    format: json
    filename: "{primary}.json"
    view:
      primary: name
      fields: [name, organisation]
      sort: [name]
    fields:
      - name: name
        label: Name
        type: string
        required: true
      - name: role
        label: Role
        type: string
        required: true
        description: Their job title, e.g. Principal, Tower Hamlets College.
      - name: organisation
        label: Organisation
        type: string
        required: true
      - name: quote
        label: Full quote
        type: text
        required: true
        description: Paste it exactly as the client wrote it. Don't tidy or improve it.
      - name: excerpt
        label: Short version (optional)
        type: text
        description: A shorter cut of the same quote for small spaces. Use their words only, with … where you cut.

  # ---------------------------------------------------------------- Clients
  - name: clients
    label: Client list
    type: file
    path: src/data/clients.json
    format: json
    list: true
    fields:
      - name: id
        label: ID
        type: string
        required: true
        description: Lower case with hyphens, e.g. new-city-college. Must be unique.
      - name: name
        label: Name
        type: string
        required: true
        description: As shown on the site.
      - name: kind
        label: Group
        type: select
        required: true
        options:
          values: [Education, Companies, Music]

  # ---------------------------------------------------------------- Settings
  - name: settings
    label: Site settings
    type: file
    path: src/data/settings.json
    format: json
    fields:
      - name: headline
        label: Homepage headline
        type: string
        required: true
      - name: intro
        label: Homepage intro
        type: text
        required: true
      - name: audience
        label: Who you work with
        type: text
        required: true
      - name: email
        label: Contact email
        type: string
        required: true
      - name: availability
        label: Availability
        type: object
        description: The line that tells people when you can start new work.
        fields:
          - name: show
            label: Show availability
            type: boolean
            default: true
          - name: from
            label: Available from
            type: string
            description: Year and month as YYYY-MM, e.g. 2026-11 for November 2026.
          - name: label
            label: Wording
            type: string
            description: e.g. "Taking on new projects"
      - name: responseTime
        label: Reply time
        type: string
        description: e.g. "I reply within one working day."
      - name: pricesNote
        label: Note under prices
        type: text
      - name: bookingUrl
        label: Booking link (optional)
        type: string
        description: A Cal.com link so people can book a call. Leave empty if you don't use one.
      - name: web3formsKey
        label: Web3Forms access key
        type: string
        description: From web3forms.com. Until this is filled in, the contact form opens an email instead.
      - name: turnstileSiteKey
        label: Cloudflare Turnstile site key (optional)
        type: string
        description: Spam protection for the form. Leave empty unless you set it up.
      - name: analyticsToken
        label: Cloudflare Web Analytics token (optional)
        type: string
        description: Leave empty for no analytics.
      - name: social
        label: Social links
        type: object
        fields:
          - name: instagram
            label: Instagram
            type: string
          - name: tiktok
            label: TikTok
            type: string
          - name: linkedin
            label: LinkedIn
            type: string
      - name: company
        label: Company details
        type: object
        description: UK law requires these on a company website.
        fields:
          - name: name
            label: Company name
            type: string
          - name: registeredIn
            label: Registered in
            type: string
          - name: number
            label: Company number
            type: string
            description: From Companies House, 8 digits.
          - name: office
            label: Registered office address
            type: string
          - name: vat
            label: VAT number (optional)
            type: string
            description: Leave empty if you're not VAT registered.

# Pages CMS (pagescms.org). Content only: the design is not editable here.
# Field names must match src/content.config.ts.

settings:
  commit:
    identity: user # commits carry Josh's name and email, not the app's

media:
  - name: images
    label: Images
    input: src/assets # Astro optimises anything here (AVIF/WebP, responsive sizes)
    output: "@assets"
    categories: [image]
    rename: safe
  - name: videos
    label: Short videos
    input: public/media/video
    output: /media/video
    categories: [video]
    rename: safe

components:
  picture:
    type: object
    label: Image
    fields:
      - name: src
        label: Image file
        type: image
        required: true
        options:
          media: images
      - name: alt
        label: Alt text
        type: string
        required: true
        description: What the image shows, for people who can't see it.
  caption:
    type: object
    label: Plate caption
    fields:
      - name: title
        label: Line 1 (title, client, year)
        type: string
        required: true
      - name: medium
        label: Line 2 (medium or what it is)
        type: string
        required: true

content:
  - name: projects
    label: Projects
    type: collection
    path: src/content/projects
    format: yaml
    filename:
      template: "{fields.slug}.yml"
      field: false
    view:
      primary: title
      sort: featuredOrder
      order: asc
    fields:
      - { name: title, label: Title, type: string, required: true }
      - name: slug
        label: Web address
        type: string
        required: true
        description: "The end of the page address, e.g. oxford-school-of-english. Lowercase, hyphens, no spaces. Don't change it once the project is live."
      - name: client
        label: Client
        type: reference
        required: true
        options: { collection: clients, value: "{path}", label: "{primary}" }
      - { name: year, label: Year, type: number, required: true }
      - name: disciplines
        label: Disciplines
        type: select
        required: true
        options:
          multiple: true
          values: [Visual identity, Branding, Data visualisation, Graphic design, Reports, Social media editing, CGI, 3D animation]
      - name: sector
        label: Sector
        type: select
        required: true
        options:
          values: [Education, Public sector, Commercial, Arts]
      - name: outcome
        label: Outcome line
        type: string
        required: true
        description: One line on where the work was used. Shown on the project card.
      - { name: featured, label: Show on the home page, type: boolean }
      - name: featuredOrder
        label: Home page position
        type: number
        description: 1 shows first. Only used when "Show on the home page" is on.
      - { name: archive, label: Archive (hide from All work), type: boolean }
      - { name: cover, label: Cover image, component: picture, required: true }
      - { name: coverCaption, label: Cover plate caption, component: caption, required: true }
      - { name: problem, label: The problem, type: text }
      - { name: whatIDid, label: What I did, type: text }
      - { name: whatHappened, label: What happened, type: text }
      - name: testimonial
        label: Testimonial
        type: reference
        options: { collection: testimonials, value: "{path}", label: "{primary}" }
      - name: next
        label: Next project
        type: reference
        options: { collection: projects, value: "{path}", label: "{primary}" }
      - name: blocks
        label: Page sections
        type: block
        list: true
        blockKey: type
        blocks:
          - name: text
            label: Text
            fields:
              - { name: body, label: Text, type: text, required: true }
              - { name: caption, component: caption }
          - name: image
            label: Full-width image
            fields:
              - { name: image, component: picture, required: true }
              - { name: caption, component: caption, required: true }
          - name: imagePair
            label: Two images side by side
            fields:
              - { name: left, label: Left image, component: picture, required: true }
              - { name: right, label: Right image, component: picture, required: true }
              - { name: caption, component: caption, required: true }
          - name: video
            label: Video
            fields:
              - name: file
                label: Short video file (under 25 MB)
                type: file
                options: { media: videos }
              - name: url
                label: Or a link to a longer film
                type: string
                description: For films stored on media.conceptualstudio.co.uk. Fill in this or the file, not both.
              - { name: poster, label: Still shown before it plays, component: picture }
              - { name: caption, component: caption, required: true }
          - name: stat
            label: Big number
            fields:
              - { name: value, label: Number, type: string, required: true }
              - { name: label, label: What it counts, type: string, required: true }
              - { name: caption, component: caption }
          - name: quote
            label: Quote
            fields:
              - name: testimonial
                label: Testimonial
                type: reference
                required: true
                options: { collection: testimonials, value: "{path}", label: "{primary}" }
              - { name: caption, component: caption }
          - name: chartImage
            label: Chart image
            fields:
              - { name: image, component: picture, required: true }
              - { name: caption, component: caption, required: true }
          - name: beforeAfter
            label: Before and after
            fields:
              - { name: before, label: Before, component: picture, required: true }
              - { name: after, label: After, component: picture, required: true }
              - { name: caption, component: caption, required: true }

  - name: services
    label: Services
    type: collection
    path: src/content/services
    format: yaml
    filename:
      template: "{fields.slug}.yml"
      field: false
    view: { primary: name }
    fields:
      - { name: name, label: Name, type: string, required: true }
      - { name: slug, label: Web address, type: string, required: true }
      - { name: summary, label: Summary, type: text, required: true }
      - { name: includes, label: What's included, type: string, list: true }
      - name: tiers
        label: Pricing ladder
        type: object
        list:
          collapsible:
            summary: "{name}"
        fields:
          - { name: name, label: Rung name, type: string, required: true }
          - { name: fromPrice, label: From price, type: string, required: true, description: "e.g. £4,900 or £1,200 a month" }
          - { name: timeline, label: From time, type: string, description: "Calendar time, e.g. from 4 weeks" }
          - { name: includes, label: What it includes, type: text, required: true }
      - name: faqs
        label: Questions
        type: object
        list: true
        fields:
          - { name: question, label: Question, type: string, required: true }
          - { name: answer, label: Answer, type: text, required: true }
      - name: related
        label: Related projects
        type: reference
        options: { collection: projects, multiple: true, value: "{path}", label: "{primary}" }

  - name: testimonials
    label: Testimonials
    type: collection
    path: src/content/testimonials
    format: yaml
    filename: "{name}.yml"
    view: { primary: name }
    fields:
      - { name: quote, label: Quote (word for word), type: text, required: true }
      - { name: name, label: Name, type: string, required: true }
      - { name: role, label: Role, type: string, required: true }
      - { name: organisation, label: Organisation, type: string, required: true }

  - name: clients
    label: Clients
    type: collection
    path: src/content/clients
    format: yaml
    filename: "{name}.yml"
    view: { primary: name }
    fields:
      - { name: name, label: Name, type: string, required: true }
      - name: logo
        label: Logo (SVG)
        type: image
        options: { media: images, extensions: [svg] }
      - { name: trustedBy, label: Show in "Trusted by", type: boolean }

  - name: settings
    label: Site settings
    type: file
    path: src/content/settings/site.yml
    format: yaml
    fields:
      - { name: availability, label: Taking new projects, type: boolean }
      - { name: availabilityText, label: Availability text, type: string, required: true }
      - { name: email, label: Email, type: string, required: true }
      - { name: responseTime, label: Reply time, type: string, required: true }
      - name: socialLinks
        label: Social links
        type: object
        list: true
        fields:
          - { name: label, label: Name, type: string, required: true }
          - { name: url, label: Link, type: string, required: true }
      - { name: companyName, label: Company name, type: string, required: true }
      - { name: companyNumber, label: Company number, type: string }

    description: "The words on the Contact page and the enquiry form (which also shows on the Services pages). The email address is in Site settings. Never add a phone number here. Write {reply time} to drop in the Reply time from Site settings."
    fields:
      - { name: heading, label: Heading, type: string, required: true }
      - { name: intro, label: Intro, type: text, required: true }

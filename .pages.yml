# Pages CMS (pagescms.org). Content only: the design is not editable here.
# Field names must match src/content.config.ts.

settings:
  commit:
    identity: user # commits carry Josh's name and email, not the app's

media:
  - name: images
    label: Images
    input: src/assets # Astro optimises anything here (AVIF/WebP, responsive sizes)
    output: "@assets"
    categories: [image]
    rename: safe
  - name: videos
    label: Short videos
    input: public/media/video
    output: /media/video
    categories: [video]
    rename: safe

components:
  picture:
    type: object
    label: Image
    fields:
      - name: src
        label: Image file
        type: image
        required: true
        description: "Upload a large file. The site makes the smaller sizes itself."
        options:
          media: images
      - name: alt
        label: Description (alt text)
        type: string
        required: true
        description: "What the image shows, in plain words, for people who can't see it."
      - name: caption
        label: Caption
        type: string
        required: true
        description: "The small line under the image, e.g. \"Student lanyards and ID cards\"."

content:
  - name: projects
    label: Projects
    type: collection
    path: src/content/projects
    format: yaml
    filename:
      template: "{fields.slug}.yml"
      field: false
    view:
      primary: title
      fields: [title, client, year]
      sort: [order, title]
    fields:
      - { name: title, label: Title, type: string, required: true }
      - name: slug
        label: Web address
        type: string
        required: true
        description: "The end of the page address, e.g. oxford-school-of-english. Lowercase letters and hyphens, no spaces. Don't change it once the project is live."
      - { name: client, label: Client, type: string, required: true }
      - { name: year, label: Year, type: number, required: true }
      - name: disciplines
        label: Disciplines
        type: string
        list: true
        required: true
        description: "Shown on the card, e.g. Visual identity, Branding. One per line."
      - name: filters
        label: Work page filters
        type: select
        description: "Which filter buttons on the Work page show this project."
        options:
          multiple: true
          values: [Brand identity, Data visualisation, 3D and motion]
      - name: studentWork
        label: Student work
        type: boolean
        description: "Tick for university work. It then only shows under \"Archive: student work\"."
      - name: label
        label: Card label (optional)
        type: string
        description: "A small label on the project card, e.g. Concept. Student work is labelled Student Work automatically."
      - name: order
        label: Position on the Work page
        type: number
        description: "Lower numbers come first. The current projects go up in tens (10, 20, 30...), so a new one can go in between, e.g. 15."
      - name: summary
        label: One-line description
        type: text
        required: true
        description: "Shown on the project card. Say where the work was used."
      - { name: cover, label: Cover image, component: picture, required: true }
      - name: thumb
        label: Card thumbnail (optional)
        type: image
        options:
          media: images
        description: "The picture on the Work page and home page cards. Leave empty to use the cover. Best as a 4:3 image with the work shown whole in the middle, on a warm black ground, with space round it so it survives being cropped."
      - name: coverFocus
        label: Cover crop (optional)
        type: string
        description: "Which part of the cover stays in view when it's cropped. Leave empty for the centre. Left-right then top-bottom, e.g. 50% 0% keeps the top."

      - name: featured
        label: Show on the home page
        type: boolean
      - name: featuredOrder
        label: Home page position
        type: number
        description: "Lower numbers come first. The first six show on the home page (two rows of three); any more appear under \"Show More\"."
      - name: homeFilter
        label: Home page filter (optional)
        type: select
        description: "Which filter button on the home page shows this project. Leave empty to follow the Work page filters (Brand identity shows under Branding, Data visualisation under Data Visualisation)."
        options:
          values: [Branding, Data Visualisation, Social Media]
      - name: homeFocus
        label: Home page crop (optional)
        type: string
        description: "Only if the home page card needs a different crop from the cover crop."
      - name: homeCharts
        label: Charts under the card on the home page (optional)
        type: object
        list: { max: 3 }
        description: "Up to three images shown in a row under this project's home page card. The first is the big one."
        fields:
          - { name: src, label: Image file, type: image, required: true, options: { media: images } }
          - { name: alt, label: Description (alt text), type: string, required: true }
          - { name: title, label: Caption line 1, type: string, required: true }
          - { name: caption, label: Caption line 2, type: string, required: true }

      - name: magazine
        label: Magazine pages (optional)
        type: object
        list: true
        description: "For a magazine or booklet: every page in order, one image per page, front cover first and back cover last. The card then opens a magazine you can turn the pages of, instead of a case study page. Pages are tall single pages, not spreads."
        fields:
          - { name: src, label: Page image, type: image, required: true, options: { media: images } }
          - { name: alt, label: Description (alt text), type: string, required: true }

      - name: hasPage
        label: Has its own case study page
        type: boolean
        description: "Tick when the fields below are filled in. Without it the card shows on the Work page but doesn't open a page."
      - name: outcome
        label: Outcome
        type: string
        description: "One short line, e.g. \"Now a UK-registered trademark.\" Also shows on the home page work card."
      - name: problem
        label: The problem
        type: text
        description: "Leave an empty line between paragraphs. Start lines with - to make a bulleted list."
      - name: whatIDid
        label: What I did
        type: text
        description: "Leave an empty line between paragraphs. Start lines with - to make a bulleted list."
      - name: gallery
        label: The work (image rows)
        type: object
        list: true
        description: "Each row is one line of images on the page, top to bottom."
        fields:
          - name: layout
            label: Layout
            type: select
            required: true
            options:
              values: [One large, Two side by side, Three in a row, Four in a grid]
          - name: heading
            label: Chapter heading (optional)
            type: string
            description: "Starts a new chapter of the story at this row, e.g. The Star Note. Shown big above the row. Leave empty to carry on the chapter above."
          - name: text
            label: Chapter text (optional)
            type: text
            description: "A short paragraph beside the chapter heading. Two or three sentences."
          - name: images
            label: Images
            component: picture
            list: { min: 1, max: 4 }
            required: true
      - { name: before, label: Before (optional), component: picture }
      - { name: after, label: After (optional), component: picture }
      - name: whatHappened
        label: What happened
        type: text
        description: "Leave an empty line between paragraphs. Start lines with - to make a bulleted list."
      - name: heroVideo
        label: Opening video (optional)
        type: object
        description: "A short silent clip shown at the top of the case study in place of the title graphic, e.g. a logo reveal. It plays once and stops on its last frame. Square or landscape MP4, under 2 MB."
        fields:
          - { name: video, label: Video file (MP4), type: file, required: true, options: { media: videos } }
          - { name: poster, label: Last frame (still), type: image, required: true, options: { media: images }, description: "A still of the clip's final frame. Shown before it plays and to visitors who turn motion off." }
          - { name: alt, label: Description (alt text), type: string, required: true }
      - { name: demoLink, label: Live demo link (optional), type: string, description: "A full web address, e.g. https://... Shows a button at the top of the case study page. Empty hides it." }
      - { name: demoButton, label: Live demo button text (optional), type: string, description: "e.g. See the Live Demo." }

  - name: services
    label: Services and prices
    type: collection
    path: src/content/services
    format: yaml
    # Pages CMS assumes .md files unless told otherwise, which hid all three services (Josh, 28 Oct).
    extension: yml
    filename: "{primary}.yml"
    view:
      primary: name
      sort: [order]
    fields:
      - { name: name, label: Name, type: string, required: true }
      - { name: order, label: Order, type: number, description: "Lower numbers come first." }
      - { name: page, label: Page address, type: string, description: "The service's own page, e.g. /services/brand-identity/. Leave empty if it doesn't have one." }
      - { name: card, label: Show as a card, type: boolean, description: "For a service with no page of its own: tick to show it as a full card on the Services page and a row on the home page, not a line under Also Available." }
      - { name: summary, label: Description, type: text, required: true }
      - name: cardImage
        label: Card picture
        type: object
        description: "A piece of real work shown at the top of this service's card on the Services page. Leave empty for no picture."
        fields:
          - { name: src, label: Image, type: image, required: true, options: { media: images } }
          - { name: alt, label: Image description, type: string, required: true, description: "What the picture shows, for people using screen readers." }
          - { name: focus, label: Focus point, type: string, description: "Which part stays in view when the picture is cropped, e.g. 50% 40%. Leave empty for the centre." }
      - name: tiers
        label: Pricing ladder
        type: object
        list:
          min: 1
          collapsible:
            summary: "{fields.name}: {fields.price}"
        description: "The rungs, cheapest first. The first rung's price and time also show on the Services page and home page."
        fields:
          - { name: name, label: Rung name, type: string, required: true }
          - { name: price, label: Price, type: string, required: true, description: "Written exactly as it should appear, e.g. From £4,900 or From £1,200 a month" }
          - { name: time, label: Time, type: string, description: "Calendar time, e.g. from 4 weeks" }
          - { name: includes, label: What it includes, type: text, required: true, description: "Put each item on its own line to show them as a list." }
          - { name: note, label: Small note (optional), type: string, description: "e.g. Quoted per project." }
          - { name: lead, label: Who it's for (optional), type: string, description: "One line under the name, e.g. For growing brands that need a steady design partner." }
          - { name: badge, label: Badge (optional), type: string, description: "e.g. Most popular. A rung with a badge is shown in glass so it stands out. Use it on one rung only." }
          - { name: button, label: Button text (optional), type: string, description: "e.g. Start a retainer. Leave empty for Choose this. Every button opens the enquiry form with this rung chosen." }
          - { name: monthly, label: Monthly plan, type: boolean, description: "Tick to list this rung under Monthly plans on the home page. Leave unticked for one-off projects." }
          - { name: onHome, label: Show on the home page, type: boolean, description: "Tick to list this rung in the home page Services list." }
      - name: homePrice
        label: Home page price (optional)
        type: string
        description: "Leave empty to use the first rung's price. Only fill in if the home page should say something different, e.g. From £200 per video."
      - name: homeTime
        label: Home page time (optional)
        type: string
        description: "Leave empty to use the first rung's time."
      - { name: homeLink, label: Home page link text, type: string, description: "e.g. Brand identity prices" }
      - { name: lane, label: Lane, type: string, description: "The group it sits in on the Services page, e.g. Video, Colleges & Data, Branding. Its first rung is shown as the easy first step." }
      - { name: kinds, label: Kinds of work (own page), type: text, description: "One or two lines on the service's own page, under the description." }
      - name: examples
        label: Recent work (own page)
        type: object
        list: true
        description: "Real work shown on the service's own page, two side by side."
        fields:
          - { name: src, label: Image file, type: image, required: true, options: { media: images } }
          - { name: alt, label: Description (alt text), type: string, required: true }
          - { name: focus, label: Crop (optional), type: string, description: "Left-right then top-bottom, e.g. 50% 40%." }
          - { name: title, label: Caption line 1, type: string, required: true }
          - { name: caption, label: Caption line 2, type: string, required: true }
      - name: faqs
        label: Questions (own page)
        type: object
        list: true
        fields:
          - { name: question, label: Question, type: string, required: true }
          - { name: answer, label: Answer, type: text, required: true }
      - { name: demoHeading, label: Chart demo heading (optional), type: string, description: "Data visualisation page only: the heading beside the table that turns into a chart. Empty hides the demo." }
      - { name: demoText, label: Chart demo text (optional), type: text }

  - name: testimonials
    label: Testimonials
    type: collection
    path: src/content/testimonials
    format: yaml
    filename: "{fields.name}.yml"
    view: { primary: name }
    fields:
      - { name: quote, label: Quote (word for word), type: text, required: true }
      - { name: name, label: Name, type: string, required: true }
      - { name: role, label: Role (optional), type: string }
      - { name: organisation, label: Organisation, type: string, required: true }
      - { name: onHomePage, label: Show on the home page, type: boolean, description: "Tick up to three. They sit side by side above the case studies." }

  - name: clients
    label: Clients
    type: collection
    path: src/content/clients
    format: yaml
    filename: "{fields.name}.yml"
    view:
      primary: name
      sort: [order, name]
    fields:
      - { name: name, label: Name, type: string, required: true }
      - { name: trustedBy, label: Show in "Worked with", type: boolean, description: "Shows the name in the client lists on the About and Services pages and in \"Who I work with\" on the home page." }
      - { name: homeTrusted, label: Show in "Trusted By" on the home page, type: boolean, description: "The client row at the top of Why Clients Choose Us. Names follow the Order field. Shows the logo if one is uploaded, otherwise the name." }
      - name: group
        label: Group
        type: select
        options:
          values: [Education, Companies and international]
      - { name: order, label: Order, type: number, description: "Lower numbers come first." }
      - name: logo
        label: Logo (SVG)
        type: image
        description: "Shown in Trusted By on the home page in place of the name, toned to one soft cream so every logo matches, and sized by its shape so wide and square logos look even. Use a one-colour SVG with a transparent background."
        options: { media: images, extensions: [svg] }
      - { name: logoLabel, label: Name beside the logo, type: string, description: "For a logo that is only a symbol, e.g. Fou Answer's eye. Leave empty to show the logo alone." }

  - name: home
    label: Home page
    type: file
    path: src/content/home/home.yml
    format: yaml
    description: "The words on the home page. Projects, services, Trusted By clients and the quote are set in their own sections."
    fields:
      - { name: headline, label: Headline, type: string, required: true }
      - { name: intro, label: Intro, type: text, required: true, description: "The sentence under the headline. Also the page's description in search results." }
      - { name: startButton, label: Main button, type: string, required: true, description: "The big black button under the intro, e.g. Start a Project. The same words are used on the button at the end of the page." }
      - { name: workButton, label: Work button, type: string, required: true, description: "The third button under the headline, e.g. Selected Work. A ↓ is added after it; it scrolls down to the work." }
      - { name: trustedByLabel, label: Trusted By label, type: string, required: true, description: "The small label over the client names at the top of Why Clients Choose Us. The names (and logos, once uploaded) are ticked in Clients." }
      - name: stats
        label: Stats
        type: object
        list: true
        description: "The figures under the opening. Only use figures you can back up."
        fields:
          - { name: number, label: Number, type: number, required: true, description: "Counts up to this. Type the number without commas, e.g. 20000: the site adds them (20,000)." }
          - { name: after, label: After the number, type: string, description: "e.g. + or % or hr or M+" }
          - { name: label, label: Label, type: string, required: true }
      - { name: workHeading, label: Work heading, type: string, required: true, description: "The big heading over the work grid, e.g. Selected Work." }
      - { name: allProjects, label: All projects button, type: string, required: true, description: "The glass button under the work grid. It opens the Work page." }
      - name: socialVideos
        label: Social media videos
        type: object
        list: true
        description: "Vertical videos shown as cards under the Social Media filter in Selected Work. Visitors click a card to play it. Upload 9:16 MP4s, ideally 720 x 1280 and under 10 MB."
        fields:
          - { name: title, label: Title, type: string, required: true }
          - { name: year, label: Year, type: number, required: true }
          - { name: video, label: Video file (MP4), type: file, required: true, options: { media: videos } }
          - { name: poster, label: Still shown before it plays, type: image, required: true, options: { media: images } }
          - { name: alt, label: Description (alt text), type: string, required: true, description: "What the video shows, for people who can't see it." }
      - name: approach
        label: Why Clients Choose Us, what sets us apart
        type: object
        list: true
        description: "Short points under the client names: what makes the studio's approach different. Four fit in one row."
        fields:
          - { name: title, label: Title, type: string, required: true }
          - { name: text, label: Text, type: text, required: true }
      - name: results
        label: Why Clients Choose Us, proof
        type: reference
        list: true
        description: "The projects shown beside the quote, with their summaries."
        options: { collection: projects, value: "{path}", label: "{title}", search: title }
      - name: backdrop
        label: Background
        type: select
        required: true
        description: "What sits behind the sections above Start a Project: plain canvas, or the Page painting running down the page."
        options: { values: [ { value: canvas, label: Canvas }, { value: painting, label: Page painting } ] }
      - name: canvasImage
        label: Canvas texture
        type: image
        required: true
        description: "A small seamless texture, repeated behind every section and toned gold or dark."
        options: { media: images }
      - name: pageImage
        label: Page painting
        type: image
        required: true
        description: "One painting that runs down the page behind every section from Selected Work to About, toned gold or dark per section. A tall, narrow painting works best. The Start a Project art is separate."
        options: { media: images }
      - { name: aboutLead, label: About opening line, type: text, required: true }
      - { name: closeText, label: Start a Project text, type: text, required: true }
      - name: steps
        label: How We Work
        type: object
        list: true
        description: "Shown on the Services page and each service's own page. Write {reply time} to drop in the Reply time from Site settings."
        fields:
          - { name: title, label: Step, type: string, required: true }
          - { name: text, label: Text, type: text, required: true }

  - name: workPage
    label: Work page
    type: file
    path: src/content/pages/work.yml
    format: yaml
    description: "The words on the Work page. The projects are set in Projects, the clients in Clients. Write {reply time} to drop in the Reply time from Site settings."
    fields:
      - { name: heading, label: Heading, type: string, required: true }
      - { name: intro, label: Intro, type: text, required: true }
      - { name: archiveFilter, label: Student work filter, type: string, required: true, description: "The last filter button, e.g. Archive: Student Work." }
      - { name: archiveNote, label: Student work note, type: text, description: "Shown when the student work filter is chosen. Empty hides it." }
      - { name: clientsHeading, label: Clients heading, type: string, required: true }
      - { name: closeText, label: Start a Project text, type: text, required: true, description: "The words in the glass panel at the end of the page." }

  - name: caseStudyPage
    label: Case study pages
    type: file
    path: src/content/pages/case-study.yml
    format: yaml
    description: "The headings every case study page shares. Each project's own words are in Projects. Write {reply time} to drop in the Reply time from Site settings."
    fields:
      - { name: backLabel, label: Back button, type: string, required: true }
      - { name: clientLabel, label: Client label, type: string, required: true }
      - { name: disciplinesLabel, label: Disciplines label, type: string, required: true }
      - { name: outcomeLabel, label: Outcome label, type: string, required: true }
      - { name: problemHeading, label: The problem heading, type: string, required: true }
      - { name: didHeading, label: What I did heading, type: string, required: true }
      - { name: workHeading, label: The work heading, type: string, required: true }
      - { name: beforeAfterHeading, label: Before and after heading, type: string, required: true }
      - { name: happenedHeading, label: What happened heading, type: string, required: true }
      - { name: nextLabel, label: Next project label, type: string, required: true }
      - { name: closeText, label: Start a Project text, type: text, required: true, description: "The words in the glass panel at the end of the page." }

  - name: servicesPage
    label: Services page
    type: file
    path: src/content/pages/services.yml
    format: yaml
    description: "The words on the Services page and the two service pages. Prices are set in Services and prices. Write {reply time} to drop in the Reply time from Site settings."
    fields:
      - { name: heading, label: Heading, type: string, required: true }
      - { name: intro, label: Intro, type: text, required: true }
      - { name: note, label: Note under the intro, type: text, required: true }
      - { name: quoteNote, label: Fixed-quote line (optional), type: string, description: "One short line in bold under the Services intro, on the Services page and the home page. Empty hides it." }
      - { name: retainersHeading, label: Monthly plans heading, type: string, required: true }
      - { name: retainersNote, label: Monthly plans note, type: text, description: "e.g. what three days a month buys, and the minimum term." }
      - { name: listHeading, label: One-off projects heading, type: string, required: true }
      - { name: listNote, label: One-off projects note, type: text }
      - { name: extrasHeading, label: Other services heading, type: string, description: "Over the short row of services that have no page of their own, e.g. Also Available." }
      - { name: firstStepLabel, label: First step label, type: string, required: true, description: "The small label over each lane's first rung, e.g. Start with." }
      - { name: howHeading, label: How a project runs heading, type: string, required: true, description: "The steps are the How We Work steps on the Home page." }
      - name: terms
        label: Terms under the steps
        type: object
        list: true
        description: "Short notes under How a Project Runs, e.g. Timelines, Quotes, Invoices."
        fields:
          - { name: title, label: Title, type: string, required: true }
          - { name: text, label: Text, type: text, required: true }
      - { name: procurementHeading, label: Procurement box heading, type: string, required: true }
      - { name: procurementText, label: Procurement box text, type: text, required: true }
      - { name: procurementButton, label: Procurement button, type: string, required: true }
      - { name: enquiryHeading, label: Quote form heading, type: string, required: true }
      - { name: workHeading, label: Recent work heading (service pages), type: string, required: true }
      - { name: pricesHeading, label: Prices heading (service pages), type: string, required: true }
      - { name: pricesNote, label: Prices note (service pages), type: text }
      - { name: faqHeading, label: Questions heading (service pages), type: string, required: true }
      - { name: closeText, label: Start a Project text, type: text, required: true, description: "The words in the glass panel at the end of the page." }
      - { name: planEmailSubject, label: Plan email subject, type: string, required: true, description: "The subject of the email a price card's button opens. {plan} becomes the plan's name, {price} its price." }
      - { name: planEmail, label: Plan email, type: text, required: true, description: "The email a price card's button opens, ready for the client to fill in. {plan} and {price} work here too." }

  - name: aboutPage
    label: About page
    type: file
    path: src/content/pages/about.yml
    format: yaml
    description: "The words on the About page. The client names are set in Clients. Write {reply time} to drop in the Reply time from Site settings."
    fields:
      - { name: heading, label: Heading, type: string, required: true }
      - { name: intro, label: Intro, type: text, required: true }
      - { name: storyHeading, label: Story heading, type: string, required: true }
      - { name: story, label: Story, type: text, required: true, description: "Leave an empty line between paragraphs. Start lines with - to make a bulleted list." }
      - name: storyImage
        label: Story picture
        type: object
        description: "One piece of real work shown beside the story. Leave empty for no picture."
        fields:
          - { name: src, label: Image, type: image, required: true, options: { media: images } }
          - { name: alt, label: Image description, type: string, required: true, description: "What the picture shows, for people using screen readers." }
          - { name: caption, label: Caption, type: string }
          - { name: focus, label: Focus point, type: string, description: "Which part stays in view when the picture is cropped, e.g. 50% 40%. Leave empty for the centre." }
      - { name: valuesHeading, label: How I work heading, type: string, required: true }
      - name: values
        label: How I work
        type: object
        list: true
        description: "Three short principles."
        fields:
          - { name: title, label: Title, type: string, required: true }
          - { name: text, label: Text, type: text, required: true }
      - { name: clientsHeading, label: Clients heading, type: string, required: true }
      - { name: wantHeading, label: The work I want heading, type: string, required: true }
      - { name: want, label: The work I want, type: text, required: true, description: "Leave an empty line between paragraphs. Start lines with - to make a bulleted list." }
      - { name: closeText, label: Start a Project text, type: text, required: true, description: "The words in the glass panel at the end of the page." }

  - name: contactPage
